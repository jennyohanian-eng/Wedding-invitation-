<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jenny's Wedding - Dashboard</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{margin:0;background:#FFF8F0;color:#2D2D2D;padding:16px}
h1{font-size:22px;margin:0} p.sub{color:#888;font-size:13px;margin:4px 0 16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.card{background:white;border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);text-align:center}
.card b{font-size:28px;display:block}
.card span{font-size:12px;color:#888}
.card.green b{color:#22C55E}.card.red b{color:#EF4444}.card.orange b{color:#F59E0B}.card.purple b{color:#8B5CF6}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:10px}
.filters button{border:1px solid #E5E5E5;background:white;padding:8px 14px;border-radius:20px;white-space:nowrap;cursor:pointer}
.filters button.active{background:#2D2D2D;color:white}
.top{display:flex;gap:8px;margin:12px 0}
.top button,.top label{flex:1;padding:12px;border-radius:12px;border:none;font-weight:600;cursor:pointer;text-align:center}
.btn-excel{background:#E8F5E9;color:#2E7D32}
.btn-copy{background:#2D2D2D;color:white}
table{width:100%;border-collapse:collapse;background:white;border-radius:16px;overflow:hidden}
th{text-align:left;font-size:11px;color:#888;padding:12px 10px;background:#FAFAFA}
td{padding:12px 10px;border-top:1px solid #F0F0F0;font-size:14px}
.badge{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700}
.b-att{background:#DCFCE7;color:#15803D}.b-no{background:#FEE2E2;color:#B91C1C}
.b-open{background:#FEF3C7;color:#B45309}.b-none{background:#F1F1F1;color:#888}
.wa{background:#25D366;color:white;border:none;padding:7px 10px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer}
.wa:disabled{background:#DDD}
input[type=file]{display:none}
.search{width:100%;padding:12px;border:1px solid #E5E5E5;border-radius:12px;margin-bottom:12px}
</style>
</head>
<body>
<h1>💍 Jenny's Wedding Dashboard</h1>
<p class="sub">Track invitees • RSVP • WhatsApp</p>

<div class="stats">
<div class="card purple"><b id="total">0</b><span>Total Invitees</span></div>
<div class="card green"><b id="coming">0</b><span>Coming ✅</span></div>
<div class="card red"><b id="notcoming">0</b><span>Not Coming ❌</span></div>
<div class="card orange"><b id="pending">0</b><span>Pending / No Reply</span></div>
</div>

<input class="search" id="search" placeholder="🔍 Search name..." oninput="render()">

<div class="filters">
<button class="active" onclick="setFilter('all',this)">All</button>
<button onclick="setFilter('coming',this)">Coming ✅</button>
<button onclick="setFilter('notcoming',this)">Not Coming ❌</button>
<button onclick="setFilter('opened',this)">Opened, No Reply 👀</button>
<button onclick="setFilter('notopened',this)">Not Opened ⚪</button>
</div>

<div class="top">
<label class="btn-excel" for="file">📥 Upload Excel (CSV)</label>
<input type="file" id="file" accept=".csv" onchange="uploadCSV(event)">
<button class="btn-copy" onclick="copyAll()">📋 Copy All Links</button>
</div>

<table>
<thead><tr><th>Name</th><th>Guests</th><th>Status</th><th>WhatsApp</th></tr></thead>
<tbody id="tbody"></tbody>
</table>

<p style="font-size:12px;color:#999;text-align:center;margin-top:16px">Tip: Send each guest their PERSONAL link so we know who opened it.</p>

<script>
let filter='all';
let guests = JSON.parse(localStorage.getItem('jenny_guests')||'null') || [
{name:"Elie Khoury",phone:"96170123456",count:2,status:"coming",opened:true},
{name:"Rana Haddad",phone:"96179123456",count:1,status:"coming",opened:true},
{name:"Sara & Omar",phone:"96170111222",count:2,status:"notcoming",opened:true},
{name:"Maya Chamoun",phone:"96176333444",count:1,status:"opened",opened:true},
{name:"Joe Abi Nader",phone:"96170555666",count:3,status:"notopened",opened:false},
{name:"Lynn Saad",phone:"96171777888",count:2,status:"coming",opened:true},
{name:"Karim Bejjani",phone:"96170999000",count:1,status:"opened",opened:true},
{name:"Nour El Khoury",phone:"96170123457",count:2,status:"notopened",opened:false},
{name:"Tia Mansour",phone:"96179111222",count:1,status:"coming",opened:true},
{name:"Adam Fares",phone:"96176333555",count:2,status:"notopened",opened:false},
{name:"Lea Azar",phone:"96170888777",count:1,status:"notcoming",opened:true},
{name:"Chris Haddad",phone:"96170199888",count:4,status:"coming",opened:true},
];
function save(){localStorage.setItem('jenny_guests',JSON.stringify(guests))}
function getLink(g){
  let base = location.href.replace('dashboard.html','index.html');
  return base + '?guest=' + encodeURIComponent(g.name);
}
function badge(g){
  if(g.status==='coming') return '<span class="badge b-att">Coming ✅</span>';
  if(g.status==='notcoming') return '<span class="badge b-no">Not Coming ❌</span>';
  if(g.status==='opened') return '<span class="badge b-open">Opened 👀</span>';
  return '<span class="badge b-none">Not Opened ⚪</span>';
}
function render(){
  let q=document.getElementById('search').value.toLowerCase();
  let list=guests.filter(g=>{
    if(q && !g.name.toLowerCase().includes(q)) return false;
    if(filter==='coming') return g.status==='coming';
    if(filter==='notcoming') return g.status==='notcoming';
    if(filter==='opened') return g.status==='opened';
    if(filter==='notopened') return g.status==='notopened';
    return true;
  });
  document.getElementById('total').innerText=guests.length;
  document.getElementById('coming').innerText=guests.filter(g=>g.status==='coming').reduce((a,g)=>a+g.count,0)+' people';
  document.getElementById('notcoming').innerText=guests.filter(g=>g.status==='notcoming').length;
  document.getElementById('pending').innerText=guests.filter(g=>g.status==='opened'||g.status==='notopened').length;
  document.getElementById('tbody').innerHTML=list.map((g,i)=>{
    let msg=encodeURIComponent('Hi '+g.name+' 💍 You are invited to Jenny\'s Wedding! Open your invitation here: '+getLink(g));
    return `<tr><td><b>${g.name}</b><br><small style="color:#888">${g.phone}</small></td><td>${g.count}</td><td>${badge(g)}<br><select onchange="changeStatus(${guests.indexOf(g)},this.value)" style="margin-top:6px;padding:4px;border-radius:8px"><option value="notopened" ${g.status==='notopened'?'selected':''}>Not Opened</option><option value="opened" ${g.status==='opened'?'selected':''}>Opened</option><option value="coming" ${g.status==='coming'?'selected':''}>Coming</option><option value="notcoming" ${g.status==='notcoming'?'selected':''}>Not Coming</option></select></td><td><button class="wa" onclick="window.open('https://wa.me/${g.phone}?text=${msg}','_blank')">Send WhatsApp</button></td></tr>`
  }).join('');
}
function changeStatus(i,v){guests[i].status=v;guests[i].opened=v!=='notopened';save();render();}
function setFilter(f,btn){filter=f;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
function copyAll(){let t=guests.map(g=>g.name+': '+getLink(g)).join('\n');navigator.clipboard.writeText(t);alert('All links copied!')}
function uploadCSV(e){
  let file=e.target.files[0]; if(!file) return;
  let r=new FileReader(); r.onload=function(){
    let lines=r.result.split('\n').slice(1).filter(l=>l.trim());
    guests=lines.map(l=>{let p=l.split(',');return {name:(p[0]||'').trim(),phone:(p[1]||'').replace(/\D/g,''),count:parseInt(p[2])||1,status:'notopened',opened:false}}).filter(g=>g.name);
    save();render();alert('Excel uploaded! '+guests.length+' guests');
  }; r.readAsText(file);
}
// Auto-track when guest opens invitation with ?guest=
let params=new URLSearchParams(location.search);
if(params.get('guest')){
  let n=params.get('guest');
  let g=guests.find(x=>x.name.toLowerCase()===n.toLowerCase());
  if(g && g.status==='notopened'){g.status='opened';g.opened=true;save();}
}
render();
</script>
</body>
</html>
